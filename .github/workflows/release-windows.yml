name: Release Windows
# Pushing a v* tag builds the Windows x64 app as a GitHub release in this
# repository. vX.Y.Z is a stable release (updater channel: latest);
# vX.Y.Z-beta.N is a prerelease (channel: beta); vX.Y.Z-windows[.N] is a
# Windows port release of vX.Y.Z (channel: latest).
# Unsigned NSIS: no signing credentials required.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: production-release-windows
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Validate tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const t = process.env.RELEASE_TAG;
            if (!/^v\d+\.\d+\.\d+(-beta\.\d+|-windows(\.\d+)?)?$/.test(t)) throw Error("Select a vX.Y.Z, vX.Y.Z-beta.N or vX.Y.Z-windows[.N] tag");
            const beta = t.includes("-beta.");
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT,
              `version=${t.slice(1)}\nchannel=${beta ? "beta" : "latest"}\nprerelease=${beta}\n`);
          '
      - run: bun install --frozen-lockfile
      - name: Set release version
        working-directory: apps/desktop
        run: |
          $current = node -p "require('./package.json').version"
          if ($current -ne "${{ steps.tag.outputs.version }}") {
            bun pm version "${{ steps.tag.outputs.version }}" --no-git-tag-version
          }
        shell: pwsh
      - name: Build Windows installer
        run: bun run dist:release-win
      - name: Verify artifacts
        env:
          CHANNEL: ${{ steps.tag.outputs.channel }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          test -s "apps/desktop/dist/latest.yml"
          test -s "apps/desktop/dist/Powermove-${VERSION}-win-x64-setup.exe"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: powermove-windows-${{ github.ref_name }}
          path: |
            apps/desktop/dist/*-setup.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.tag.outputs.channel }}
          VERSION: ${{ steps.tag.outputs.version }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          assets=(apps/desktop/dist/*-setup.exe apps/desktop/dist/*.blockmap "apps/desktop/dist/${CHANNEL}.yml")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            # Windows port tags ship the curated changelog (Windows support
            # plus everything upstream to this version); plain version tags
            # fall back to generated notes.
            flags=(--draft --title "Powermove ${VERSION}")
            if [ -f .github/release-notes-windows.md ] && [[ "$GITHUB_REF_NAME" == *-windows* ]]; then
              flags+=(--notes-file .github/release-notes-windows.md)
            else
              flags+=(--generate-notes)
            fi
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); else flags+=(--latest); fi
            gh release create "$GITHUB_REF_NAME" "${flags[@]}" "${assets[@]}"
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi
        shell: bash
